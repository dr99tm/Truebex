# The platform's test gate on GitHub: the same three steps as the local verify
# gate (scripts/autopilot-verify.ps1): eslint, the static build, then the
# server's pytest suite against that build. Lives on master (the source);
# the main branch is the built site and keeps its own static.yml.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # A disposable Postgres for the tests marked `postgres` (TEST_DATABASE_URL);
    # the rest of the suite runs on SQLite as on the owner's PC.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: truebex
          POSTGRES_PASSWORD: truebex
          POSTGRES_DB: truebex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truebex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          # The server's Dockerfile runs python:3.12.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: npm ci
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (next build + postbuild-lang, viewer, app)
        run: npm run build

      - name: Server venv
        working-directory: server
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Server tests (pytest)
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql+psycopg://truebex:truebex@localhost:5432/truebex_test
        run: .venv/bin/python -m pytest -q -rs -p no:cacheprovider
