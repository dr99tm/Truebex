<!doctype html>
<html lang="en">
  <body style="font-family:'Segoe UI','Open Sans',Arial,sans-serif;font-size:15px;line-height:1.6;color:#232323">
    <h2 style="font-size:15px;margin:22px 0 6px">Your order</h2>
    <p style="white-space:pre-line;margin:0 0 14px">$order</p>
    <h2 style="font-size:15px;margin:22px 0 6px">Price and renewal</h2>
    <p style="white-space:pre-line;margin:0 0 14px">$renewal</p>
    <h2 style="font-size:15px;margin:22px 0 6px">Seller</h2>
    <p style="white-space:pre-line;margin:0 0 14px">$seller</p>
    <h2 style="font-size:15px;margin:22px 0 6px">What you agreed to at checkout</h2>
    <p style="white-space:pre-line;margin:0 0 14px">$agreed</p>
    <h2 style="font-size:15px;margin:22px 0 6px">How to cancel</h2>
    <p style="white-space:pre-line;margin:0 0 14px">$how_to_cancel</p>
    <h2 style="font-size:15px;margin:22px 0 6px">Documents in force</h2>
    <p style="white-space:pre-line;margin:0 0 14px">Terms: <a href="$terms_url">$terms_url</a></p>
    <p style="white-space:pre-line;margin:0 0 14px">Licence (EULA): <a href="$eula_url">$eula_url</a></p>
    <p style="color:#777;font-size:13px;white-space:pre-line">$footer</p>
  </body>
</html>
